<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Yad2 Watcher</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <div class="logo">
      <img src="icons/icon32.png" alt="" class="logo-icon" />
      <h1>Yad2 Watcher</h1>
    </div>
    <button id="refresh" class="icon-btn" title="בדוק עכשיו">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
    </button>
  </header>

  <div id="status" class="status"></div>

  <div id="listings" class="listings"></div>

  <footer class="footer">
    <button id="options" class="btn-secondary">הגדרות</button>
    <button id="reset" class="btn-secondary danger">אפס רשימה</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
